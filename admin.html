<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin BUMDes Tapak Makmur</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <h1>Admin BUMDes Tapak Makmur</h1>

  <input id="judul" placeholder="Judul berita">
  <br><br>

  <textarea id="isi" rows="8" placeholder="Isi berita"></textarea>
  <br><br>

  <input id="foto" placeholder="Link foto (opsional)">
  <br><br>

  <button onclick="simpanBerita()">Simpan Berita</button>

  <p id="pesan"></p>

  <script>
    const SUPABASE_URL = "https://kpdvtbxshxapaqdqhdsa.supabase.co";

    const SUPABASE_KEY = "TEMPEL_PUBLISHABLE_KEY_DI_SINI";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function simpanBerita() {
      const judul = document.getElementById("judul").value;
      const isi = document.getElementById("isi").value;
      const foto = document.getElementById("foto").value;

      if (!judul || !isi) {
        document.getElementById("pesan").innerText =
          "Judul dan isi berita wajib diisi.";
        return;
      }

      const { error } = await supabaseClient
        .from("Berita")
        .insert([{ judul, isi, foto }]);

      if (error) {
        document.getElementById("pesan").innerText =
          "Gagal: " + error.message;
      } else {
        document.getElementById("pesan").innerText =
          "✅ Berita berhasil disimpan!";
        document.getElementById("judul").value = "";
        document.getElementById("isi").value = "";
        document.getElementById("foto").value = "";
      }
    }
  </script>
</body>
</html>
